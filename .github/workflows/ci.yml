name: CI

# Lint, format check and build on every push and pull request.
# Vercel deploys the site itself: main to UAT, production to production (see README → Environments).
on:
  push:
    branches: [main, production]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
