name: Promote to production

# Run from the Actions tab once UAT looks right: production gets exactly what is on main (and on UAT) now.
# Vercel then deploys the production branch to https://dis.hiteffect.store.
# Promote hiteffect-dis-backend first when a change needs both, so the new site never meets an old API.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency: promote

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Move production to main
        run: |
          if git rev-parse --verify -q origin/production >/dev/null; then
            if ! git merge-base --is-ancestor origin/production origin/main; then
              echo "::error::production has commits that main doesn't have. Merge them into main first."
              exit 1
            fi
          fi
          git push origin origin/main:refs/heads/production
          {
            echo "### Promoted to production"
            echo "$(git log -1 --format='%h %s' origin/main)"
          } >> "$GITHUB_STEP_SUMMARY"
